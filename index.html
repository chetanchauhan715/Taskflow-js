<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>TaskFlow</title>
</head>
<body>

    <div class="main-container">

    <div class="header">
        <h1>Task Manager</h1>
        <p>Stay organized Gets things Done</p>
    </div>

    <div class="input-container">
        <input id="task-input" type="text" placeholder="What do you need to do">
        <select id="priority">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
        </select>
        <button id="add-btn" type="button">Add</button>
    </div>

    <div class="search-container">
        <input id="search-input" type="text" placeholder="Search Tasks">
    </div>


    <div class="filter-container">
        <select name="" id="filter">
            <option value="all">All Tasks</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
        </select>
    </div>

    <div id="task-list">
        <!-- <p>Used As Examples List Tasks will show here</p> -->
    </div>

</div>
    
</body>
</html>
